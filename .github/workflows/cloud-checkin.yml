name: WorkBuddy Cloud Checkin

# ============================================================
# 云端每日签到 · 不依赖本机开机
#
# 为什么之前的库会漏签 18 天（实测证据）：
#   gh run list 只有 2 条 workflow_dispatch（手动），**0 条 schedule**。
#   即 cron 一次都没触发过。原因通常是：
#     · 仓库连续 60 天无活动 → GitHub 自动停用 schedule
#       （官方原文：In a public repository, scheduled workflows are automatically
#         disabled when no repository activity has occurred in 60 days.
#         本仓库是 public，同样适用；预计 2027-01-08 左右触发）
#     · 新建仓库的 schedule 要等 workflow 被默认分支引用后才会生效
#     · schedule 在用量高峰会被延迟甚至丢弃
#   所以「配了 cron」≠「一定会跑」，必须用多条 cron + 幂等设计兜底。
#
# 本工作流的对策：
#   1) 6 条 cron 覆盖早/中/晚，接口幂等，重复跑只返回 code=10001
#   2) runs-on 上不依赖任何第三方 action，纯 python3 标准库
#   3) 每个账号独立 job，一个失败不影响另一个
#   4) 关键：workflow_dispatch 保留，手机上也能一键补签
#   5) 2026-11-11 起增加 cat job：猫猫派出/领奖也上云，本机不开机也能拿
#      每天那 5~10 积分（成长任务和连登兑换仍需本机）
# ============================================================

on:
  schedule:
    # 主时段：北京时间 08:05 / 08:35（上班前完成）
    - cron: '5 0 * * *'
    - cron: '35 0 * * *'
    # 午间兜底：北京时间 12:20
    - cron: '20 4 * * *'
    # 傍晚兜底：北京时间 18:20
    - cron: '20 10 * * *'
    # 夜间兜底：北京时间 21:20 / 23:20
    - cron: '20 13 * * *'
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使已签到也强制再调一次接口（默认 false）'
        type: boolean
        default: false

permissions:
  contents: read

# 多条 cron 可能在同一分钟撞车，排队而不是并行
concurrency:
  group: workbuddy-cloud-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: A
            realm: cn
          - account: B
            realm: cn
          - account: C
            realm: intl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkin ${{ matrix.account }} (${{ matrix.realm }})
        env:
          WB_TOKEN: ${{ secrets[format('WB_TOKEN_{0}', matrix.account)] }}
          WB_REFRESH: ${{ secrets[format('WB_REFRESH_{0}', matrix.account)] }}
          WB_UID: ${{ secrets[format('WB_UID_{0}', matrix.account)] }}
          WB_REALM: ${{ matrix.realm }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          if [ -z "${WB_UID:-}" ]; then
            echo "::error::账号 ${{ matrix.account }} 缺少 WB_UID_${{ matrix.account }}"
            exit 1
          fi
          if [ -z "${WB_TOKEN:-}" ] && [ -z "${WB_REFRESH:-}" ]; then
            echo "::error::账号 ${{ matrix.account }} 的令牌与 refreshToken 都为空"
            exit 1
          fi
          python3 cloud/checkin_one.py

      - name: Report on failure
        if: failure()
        run: |
          echo "::warning::账号 ${{ matrix.account }} 签到步骤失败，请查看上方日志"
          echo "### ❌ 账号 ${{ matrix.account }} 失败" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 猫猫旅行：派出 / 领奖（本机不开机时唯一还能拿到的积分）
  #
  # 一天只能派 1 趟（派完 daily_limit_reached 立刻为 true），所以 6 条
  # cron 都跑也不会多派 —— 逻辑本身幂等：
  #   idle 且当日没派过 → 派；idle 且已派过 → 不动
  #   traveling 没到站 → 什么都不做
  #   traveling 已过到站时间 或 arrived → 领奖（+5~10 积分）
  # 实测 08:05 派出 → 12:20 到站领取正好一个完整周期，不用改 cron。
  #
  # 只要 A / B 两个国内号 —— 国际站没有成长中心。
  # 接口与签到同域同鉴权，实测不需要设备指纹（见 cat_one.py 注释）。
  # ============================================================
  cat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: A
          - account: B
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cat travel ${{ matrix.account }}
        env:
          WB_TOKEN: ${{ secrets[format('WB_TOKEN_{0}', matrix.account)] }}
          WB_REFRESH: ${{ secrets[format('WB_REFRESH_{0}', matrix.account)] }}
          WB_UID: ${{ secrets[format('WB_UID_{0}', matrix.account)] }}
          WB_REALM: cn
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          if [ -z "${WB_UID:-}" ]; then
            echo "::error::账号 ${{ matrix.account }} 缺少 WB_UID_${{ matrix.account }}"
            exit 1
          fi
          python3 cloud/cat_one.py

      - name: Report on failure
        if: failure()
        run: |
          echo "::warning::账号 ${{ matrix.account }} 猫猫步骤失败，请查看上方日志"
          echo "### ❌ 猫猫 ${{ matrix.account }} 失败" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 自保活：防止「60 天无活动 → schedule 被自动停用」
  #
  # 只在中班 cron 和手动触发时运行，避免一天 6 次无谓 checkout。
  # 只有当仓库已经空闲 >= 30 天时才真的提交 —— 正常情况下两个月才产生
  # 一条 commit，历史不会被刷屏。
  #
  # 为什么放在 workflow 里而不是本机脚本：
  #   本机方案依赖电脑开机，而云端层的意义恰恰就是「不开机也能跑」。
  #   自保活完全在 GitHub 侧闭环，不需要本机、也不需要长期 PAT。
  #
  # 配套监控：本机 `python cloud/keepalive.py`（已接入 09:00 复核任务）
  #   独立核查同一件事。万一自提交不被计入活动，45 天预警仍留 15 天缓冲。
  # ============================================================
  keepalive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch activity only when idle
        run: |
          set -euo pipefail
          idle_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "仓库已空闲 ${idle_days} 天"
          if [ "$idle_days" -lt 30 ]; then
            echo "未到 30 天阈值，跳过提交（保持提交历史干净）"
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > KEEPALIVE.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KEEPALIVE.txt
          git commit -m "chore: keepalive activity reset (idle ${idle_days}d)"
          git push
          echo "### ✅ 已重置 60 天计时器（本次空闲 ${idle_days} 天）" >> "$GITHUB_STEP_SUMMARY"
